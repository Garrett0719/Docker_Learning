apiVersion: apps/v1
kind: Deployment
metadata:
  name: study-security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: study-security
  template:
    metadata:
      labels:
        app: study-security
    spec:
      containers:
      - name: study-security
        image: study-security:v3
        envFrom:
          - configMapRef:
              name: study-security-config
          - secretRef:
              name: study-security-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 15
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 3

        ports:
          - containerPort: 8080